version: '3.9'

services:

  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: plantscan_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: plantscan_db
      POSTGRES_USER: plantscan_user
      POSTGRES_PASSWORD: plantscan_pass
    ports:
      - "5434:5432"        # host 5434 → container 5432 (port 5432 & 5433 sudah dipakai lokal)
    volumes:
      - postgres_data:/var/lib/postgresql/data   # data persisten, tidak hilang saat container stop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantscan_user -d plantscan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # pgAdmin — GUI untuk mengelola PostgreSQL
  # Akses via browser: http://localhost:5050
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: plantscan_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@plantscan.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:    # menyimpan data PostgreSQL secara persisten
  pgadmin_data:     # menyimpan konfigurasi pgAdmin
